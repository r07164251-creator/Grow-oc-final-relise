
name: Grow OC Stage 7 APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Grow OC APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/project"

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname '*.zip' \
            ! -path '*/project/*' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Grow OC ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/project"

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          while IFS= read -r SETTINGS; do
            CANDIDATE=$(dirname "$SETTINGS")

            if [ -f "$CANDIDATE/gradlew" ] && \
               [ -d "$CANDIDATE/app" ]; then
              ROOT="$CANDIDATE"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE/project" \
            -type f \( \
              -name settings.gradle.kts -o \
              -name settings.gradle \
            \))

          if [ -z "$ROOT" ]; then
            echo "::error::Android Gradle project not found"
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Found project: $ROOT"

      - name: Check Java and Gradle
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build Grow OC Debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Grow-OC-Stage-7-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
