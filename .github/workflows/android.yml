
name: Grow OC Stage 7 - Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Grow OC APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No project ZIP found"
            exit 1
          fi
          echo "Using archive: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found"
            find project -maxdepth 4 -type f
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"
          ls -la "$ROOT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            echo "::error::Gradle Wrapper gradlew not found"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Grow-OC-Stage-7
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
          
