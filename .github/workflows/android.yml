
name: Grow OC Stage 7 - MEGA BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Grow OC APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/project"

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 -type f -iname '*.zip' \
            ! -path '*/project/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Grow OC ZIP not found"
            exit 1
          fi

          echo "Found archive: $ZIP"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/project"

          echo "Extraction completed"

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          while IFS= read -r SETTINGS; do
            CANDIDATE=$(dirname "$SETTINGS")

            if [ -f "$CANDIDATE/app/build.gradle.kts" ] || \
               [ -f "$CANDIDATE/app/build.gradle" ]; then
              ROOT="$CANDIDATE"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE/project" \
            -type f \( \
              -name settings.gradle.kts -o \
              -name settings.gradle \
            \))

          if [ -z "$ROOT" ]; then
            echo "::error::Android project not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project found: $ROOT"

      - name: Detect Gradle version
        id: gradle
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate.outputs.root }}"

          PROPS=$(find "$ROOT" \
            -name gradle-wrapper.properties | head -n 1)

          if [ -z "$PROPS" ]; then
            echo "::error::gradle-wrapper.properties not found"
            exit 1
          fi

          VERSION=$(sed -nE \
            's/.*gradle-([0-9]+(\.[0-9]+)+)-(bin|all)\.zip.*/\1/p' \
            "$PROPS" | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "::error::Could not detect Gradle version"
            cat "$PROPS"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected Gradle: $VERSION"

      - name: Install Gradle directly
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
          validate-wrappers: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare Android SDK
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK: $ANDROID_HOME"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          COMPILE_SDK=$(grep -hE \
            'compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+' \
            app/build.gradle.kts app/build.gradle 2>/dev/null \
            | grep -oE '[0-9]+' | head -n 1 || true)

          if [ -n "$COMPILE_SDK" ]; then
            echo "Installing Android platform $COMPILE_SDK"
            sdkmanager "platforms;android-$COMPILE_SDK"
          else
            echo "compileSdk is configured dynamically."
            echo "Available installed SDK packages:"
            sdkmanager --list_installed | head -n 60
          fi

          sdkmanager "platform-tools"

      - name: Check Java and Gradle
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Build Grow OC APK
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Grow OC compilation..."

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Find generated APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "${{ steps.locate.outputs.root }}" \
            -type f -name '*.apk' \
            -path '*/build/outputs/apk/*' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "file=$APK" >> "$GITHUB_OUTPUT"
          echo "APK ready: $APK"
          ls -lh "$APK"

      - name: Upload Grow OC APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Grow-OC-STAGE-7-APK
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Grow-OC-BUILD-LOGS
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
